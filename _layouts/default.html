<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | {{ site.title }}</title>
    {% seo %}
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 2rem auto;
        max-width: 850px;
        line-height: 1.6;
        color: #222;
      }
      header {
        border-bottom: 2px solid #eee;
        margin-bottom: 2rem;
      }
      nav {
        margin-bottom: 1rem;
      }
      nav a {
        margin-right: 1rem;
        text-decoration: none;
        color: #0366d6;
      }
      pre, code {
        background: #f5f5f5;
        padding: 0.2rem 0.4rem;
        border-radius: 4px;
      }
      img {
        max-width: 100%;
      }
      footer {
        margin-top: 3rem;
        border-top: 1px solid #eee;
        padding-top: 1rem;
        font-size: 0.9em;
        color: #666;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>{{ site.title }}</h1>
      <nav>
        <a href="{{ '/' | relative_url }}">Home</a>
      </nav>
    </header>

    <main>
      {{ content }}
    </main>

    <footer>
      © {{ site.time | date: "%Y" }} {{ site.title }}
    </footer>
  </body>
</html>
